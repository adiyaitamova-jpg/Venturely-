<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="TEAMi: find teammates, build real projects, and keep a portfolio backed by evidence."><meta name="theme-color" content="#090b10"><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>TEAMi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap">
<style>
  /* Layout: top command bar + full-width workspace; a dark console for builders, one indigo signal colour that glows where action is. */
  :root {
    --paper: #090b10; --paper-2: #10131a; --surface: #0e1117; --raised: #151922;
    --ink: #e8ebf2; --ink-2: #b4bbca; --muted: #8790a3; --faint: #5d6578;
    --line: #1c212d; --line-strong: #2a3141;
    --accent: #7c8cff; --accent-hover: #97a4ff; --accent-ink: #cdd3ff; --accent-soft: #1a1f3b; --accent-softer: #12162a; --accent-line: #343d7c;
    --glow: #b07cff;
    --pos: #4fdb9c; --pos-soft: #0f2a20; --neg: #ff8080; --neg-soft: #2c1518; --warn: #f3b860; --warn-soft: #2b2112; --info: #6ec6ff; --info-soft: #0f2336;
    --on-accent: #080a12;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font-family: "Geist", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(1200px 520px at 50% -180px, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px; background-attachment: fixed;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--paper); }
  ::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (min-width: 640px) { .gutter { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); } }
  .on-accent { color: var(--on-accent); }
  .tabular { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; }
  .font-display { letter-spacing: -0.035em; font-weight: 500; }
  .grad { background: linear-gradient(100deg, var(--accent-ink) 0%, var(--accent) 45%, var(--glow) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .card { background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 3%, transparent), transparent 120px), var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .card-glow { position: relative; border-color: var(--accent-line); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent), 0 24px 60px -30px color-mix(in srgb, var(--accent) 55%, transparent); }
  .halo { background: radial-gradient(420px 200px at 85% 0%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 70%), radial-gradient(380px 220px at 0% 100%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%), var(--surface); }
  .field { width: 100%; border: 1px solid var(--line-strong); background: var(--paper-2); color: var(--ink); border-radius: 9px; padding: 8px 12px; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .field::placeholder { color: var(--faint); }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  textarea.field { line-height: 1.55; resize: vertical; }
  select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-sm { height: 32px; padding: 0 11px; font-size: 13px; }
  .btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: inset 0 1px 0 color-mix(in srgb, white 35%, transparent), 0 6px 22px -8px var(--accent); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: inset 0 1px 0 color-mix(in srgb, white 35%, transparent), 0 8px 28px -6px var(--accent); }
  .btn-secondary { background: var(--raised); color: var(--ink); border: 1px solid var(--line-strong); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--faint); }
  .btn-ghost { color: var(--ink-2); }
  .btn-ghost:hover:not(:disabled) { background: var(--raised); color: var(--ink); }
  .btn-danger { color: var(--neg); }
  .btn-danger:hover:not(:disabled) { background: var(--neg-soft); }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--paper-2); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .chip-accent { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
  .toggle { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--paper-2); color: var(--ink-2); font-size: 13px; transition: all .15s; }
  .toggle:hover { border-color: var(--faint); }
  .toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }
  .kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; font-family: "Geist Mono", monospace; font-size: 11px; color: var(--muted); background: var(--paper-2); }
  .navlink { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 56px; padding: 0 2px; font-size: 13.5px; color: var(--muted); transition: color .15s; }
  .navlink:hover { color: var(--ink); }
  .navlink[aria-current="page"] { color: var(--ink); }
  .navlink[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .row-hover { transition: background-color .12s; }
  .row-hover:hover { background: color-mix(in srgb, var(--ink) 3.5%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  button { cursor: pointer; }
  .prose-ai { font-size: 14.5px; line-height: 1.65; color: var(--ink-2); }
  .prose-ai > * + * { margin-top: .7em; }
  .prose-ai ul { list-style: disc; padding-left: 1.2em; } .prose-ai ol { list-style: decimal; padding-left: 1.2em; }
  .prose-ai strong { color: var(--ink); font-weight: 600; }
  .prose-ai code { font-family: "Geist Mono", monospace; font-size: .86em; background: var(--raised); padding: .1em .35em; border-radius: 4px; }
  .prose-ai h1, .prose-ai h2, .prose-ai h3 { font-weight: 600; color: var(--ink); font-size: 15px; }
  .shimmer { animation: shimmer 1.6s ease-in-out infinite; background: var(--raised); border-radius: 6px; }
  @keyframes shimmer { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
  .fade-in { animation: fadein .2s ease-out; }
  @keyframes fadein { from { opacity: .4; transform: translateY(4px) } to { opacity: 1; transform: none } }
  .pulse-dot { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pos) 55%, transparent) } 50% { box-shadow: 0 0 0 5px transparent } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .scrollbar-none { scrollbar-width: none; } .scrollbar-none::-webkit-scrollbar { display: none; }
</style>
